%YAML 1.1
---

default-log-dir: /var/log/suricata/
default-rule-path: /etc/suricata/rules
rule-files:
  - local.rules

stream:
  checksum-validation: no
  midstream: true
  async-oneside: true

# через NFQUEUE
nfq:
  mode: accept

app-layer:
  protocols:
    http:
      enabled: yes
    dns:
      enabled: yes
    tls:
      enabled: yes

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert
        - http
        - dns
        - tls
        - flow

logging:
  outputs:
    - console:
        enabled: yes
        level: info
    - file:
        enabled: yes
        level: info
        filename: suricata.log